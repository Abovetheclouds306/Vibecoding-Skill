name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trust-and-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: vb_trust (pinned Standard v1.2.8)
        run: python -B vibecoding/scripts/vb_trust.py vibecoding/vendor/vibecoding-standard
      - name: unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s tests -v
